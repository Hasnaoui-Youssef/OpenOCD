# This is for all ST NUCLEO with any STM32U0. Known boards at the moment:
# NUCLEO-U031R8
# https://www.st.com/en/evaluation-tools/nucleo-u031r8.html
# NUCLEO-U083RC
# https://www.st.com/en/evaluation-tools/nucleo-u083rc.html

source [find interface/stlink.cfg]

transport select hla_swd

source [find target/stm32u0x.cfg]

reset_config srst_only
